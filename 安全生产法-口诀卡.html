<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>《安全生产法》口诀卡 · 总则/方针</title>
<style>
  :root{
    --bg:#fafafa; --card:#ffffff; --line:#e5e7eb; --soft:#f3f4f6;
    --tx:#111827; --mute:#6b7280; --sub:#9ca3af;
    --p:#2563eb; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
    --front:#fffbeb; --front-line:#fde68a; --front-tx:#78350f;
    --back:#eff6ff; --back-line:#bfdbfe; --back-tx:#1e40af;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:14px;line-height:1.6}
  h1{margin:0;font-size:20px;font-weight:700}
  .head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .meta{color:var(--mute);font-size:12px}
  .meta b{color:var(--tx);font-size:14px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:5px 12px;border:1px solid var(--line);background:var(--card);border-radius:16px;font-size:12px;cursor:pointer;color:var(--mute);user-select:none}
  .chip.on{background:var(--p);border-color:var(--p);color:#fff}
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px}
  .card3d{width:min(520px,94vw);height:280px;perspective:1200px;cursor:pointer}
  .card3d .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
  .card3d.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:26px 30px;display:flex;flex-direction:column;box-shadow:0 4px 16px rgba(0,0,0,.06)}
  .face.front{background:var(--front);border:1.5px solid var(--front-line)}
  .face.back{background:var(--back);border:1.5px solid var(--back-line);transform:rotateY(180deg)}
  .face .tagrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub);margin-bottom:8px}
  .face .badge{display:inline-block;padding:2px 8px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--mute)}
  .face .badge.hot{background:#fee2e2;border-color:#fecaca;color:#b91c1c}
  .front .mnemonic{font-size:26px;font-weight:800;color:var(--front-tx);letter-spacing:2px;line-height:1.5;margin-bottom:10px}
  .front .hint{font-size:13px;color:#b45309}
  .back .article{font-size:15px;color:var(--back-tx);font-weight:600;margin-bottom:8px}
  .back .detail{font-size:13.5px;color:#1e3a8a;white-space:pre-wrap}
  .back .src{font-size:11.5px;color:#64748b;margin-top:auto;border-top:1px dashed var(--back-line);padding-top:8px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:13px;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--soft)}
  .btn.primary{background:var(--p);border-color:var(--p);color:#fff}
  .btn.ok{border-color:var(--ok);color:var(--ok)}
  .btn.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.ghost{background:transparent}
  .progress{display:flex;align-items:center;gap:10px;width:min(520px,94vw)}
  .pbar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
  .pbar .fill{height:100%;background:var(--ok);border-radius:4px;transition:width .3s}
  .pn{font-size:13px;color:var(--mute)}
  .note{margin-top:16px;text-align:center;font-size:11.5px;color:var(--sub)}
  .note code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:11px}
  .empty{text-align:center;color:var(--sub);padding:40px 0}
</style>
</head>
<body>

    <div class="meta">共 <b id="totalN">30</b> 张 · 已掌握 <b id="masteredN">0</b> · 点击卡片翻面</div>
  </div>
  <button class="btn" onclick="resetAll()" title="清空所有'已掌握'标记">重置掌握</button>
</div>

<div class="filters" id="filters"></div>

<div class="stage" id="stage"></div>

<script src="sync.js"></script>

/* =================== STORAGE（与工作台/看板共享 safe_plan_ namespace） =================== */
/* load/save/NS 已统一在 sync.js 提供（服务端同步），此处不再定义 */

/* =================== STATE =================== */
let mastered = load('cardMastered', []);       // [id,...]
let grpFilter = '全部';                          // '全部' or grp name
let onlyUnseen = false;                          // 只看未掌握
let idx = 0;
let flipped = false;
let deck = [];                                   // 当前展示序列

function buildDeck(){
  deck = CARDS.filter(c=>{
    if(grpFilter!=='全部' && c.grp!==grpFilter) return false;
    if(onlyUnseen && mastered.includes(c.id)) return false;
    return true;
  });
  if(idx>=deck.length) idx=0;
}

/* =================== RENDER =================== */
function renderFilters(){
  const grps = ['全部', ...Array.from(new Set(CARDS.map(c=>c.grp)))];
  document.getElementById('filters').innerHTML =
    grps.map(g=>`<span class="chip ${g===grpFilter?'on':''}" onclick="setGrp('${g}')">${g}${g==='全部'?` · ${CARDS.length}`:''}</span>`).join('') +
    `<span class="chip ${onlyUnseen?'on':''}" style="margin-left:6px" onclick="toggleUnseen()">只看未掌握</span>`;
}

function render(){
  renderFilters();
  document.getElementById('totalN').textContent = CARDS.length;
  document.getElementById('masteredN').textContent = mastered.length;
  const stage = document.getElementById('stage');
  if(!deck.length){
    stage.innerHTML = `<div class="empty">当前筛选下没有卡片。<br><button class="btn" style="margin-top:10px" onclick="clearFilters()">清除筛选</button></div>`;
    return;
  }
  const c = deck[idx];
  const isMastered = mastered.includes(c.id);
  stage.innerHTML = `
    <div class="progress">
      <div class="pn">${idx+1} / ${deck.length}</div>
      <div class="pbar"><div class="fill" style="width:${(idx+1)/deck.length*100}%"></div></div>
      <span class="chip" style="cursor:default;color:${isMastered?'var(--ok)':'var(--sub)'}">${isMastered?'✔ 已掌握':'未掌握'}</span>
    </div>
    <div class="card3d ${flipped?'flipped':''}" id="card3d" onclick="flip()">
      <div class="inner">
        <div class="face front">
          <div class="tagrow"><span class="badge ${c.hot?'hot':''}">${c.hot?'🔥 高频':'✦ 记忆'}</span><span class="badge">${c.grp}</span></div>
          <div class="mnemonic">${c.front}</div>
          <div class="hint">${c.hint}</div>
        </div>
        <div class="face back">
          <div class="tagrow"><span class="badge">${c.grp} · 背面</span><span class="badge">点击回正面</span></div>
          <div class="article">${c.article}</div>
          <div class="detail">${c.detail}</div>
          <div class="src">出处：${c.src}</div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" onclick="prev()">◀ 上一张</button>
      <button class="btn" onclick="flip()">翻面</button>
      <button class="btn ${isMastered?'ok on':''}" onclick="toggleMaster()">${isMastered?'✔ 已掌握':'标为掌握'}</button>
      <button class="btn" onclick="next()">下一张 ▶</button>
      <button class="btn ghost" onclick="shuffle()">🔀 打乱</button>
    </div>`;
  // 显示当前卡序号
}

/* =================== ACTIONS =================== */
function flip(){ flipped=!flipped; render(); }
function next(){ if(deck.length){ idx=(idx+1)%deck.length; flipped=false; render(); } }
function prev(){ if(deck.length){ idx=(idx-1+deck.length)%deck.length; flipped=false; render(); } }
function shuffle(){
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  idx=0; flipped=false; render();
}
function toggleMaster(){
  const c=deck[idx]; if(!c) return;
  const i=mastered.indexOf(c.id);
  if(i>=0) mastered.splice(i,1); else mastered.push(c.id);
  save('cardMastered', mastered);
  // 只看未掌握模式下自动跳到下一张
  if(onlyUnseen && i<0){ idx=(idx+1)%deck.length; }
  flipped=false; render();
}
function setGrp(g){ grpFilter=g; idx=0; flipped=false; buildDeck(); render(); }
function toggleUnseen(){ onlyUnseen=!onlyUnseen; idx=0; flipped=false; buildDeck(); render(); }
function clearFilters(){ grpFilter='全部'; onlyUnseen=false; buildDeck(); render(); }
function resetAll(){
  if(!confirm('确认清空所有"已掌握"标记？')) return;
  mastered=[]; save('cardMastered', mastered); flipped=false; render();
}

/* =================== INIT =================== */
runWhenReady(()=>{
  mastered = load('cardMastered', []);
  buildDeck();
  render();
});
</script>
</body>
</html>
